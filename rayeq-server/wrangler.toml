name = "rayeq-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false            # نسخة اختبار بـAUTH_ENABLED=false يجب ألا تبقى متاحة

[vars]
AUTH_ENABLED = "true"           # true = /v1/tmdb و/v1/sources تتطلب جلسة موافق عليها
ADMIN_USER = "admin"

[[d1_databases]]
binding = "DB"
database_name = "rayeq-db"
database_id = "<D1_DATABASE_ID>"
migrations_dir = "migrations"

[ai]
binding = "AI"                  # اختياري: /v1/smart-search فقط
